name: build

on:
  push:
  workflow_dispatch:
    inputs:
      gradle_version:
        description: 'Gradle version'
        default: '8.14'
      loom_version:
        description: 'Fabric Loom (пусто = авто)'
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version || '8.14' }}

      - name: Resolve Fabric versions (inline)
        env:
          LOOM_OVERRIDE: ${{ inputs.loom_version }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.parse, urllib.request
          from pathlib import Path
          PROPS = Path("gradle.properties")
          if not PROPS.exists():
              sys.exit("нет gradle.properties в корне репозитория")
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "triggerbot-ci/1.0"})
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.read().decode("utf-8")
          text = PROPS.read_text(encoding="utf-8")
          def prop(key):
              m = re.search(rf"^{key}\s*=\s*(.+)$", text, re.M)
              return m.group(1).strip() if m else ""
          mc = prop("minecraft_version")
          if not mc: sys.exit("minecraft_version не задан")
          print("Minecraft:", mc)
          upd = {}
          try:
              d = json.loads(get(f"https://meta.fabricmc.net/v2/versions/yarn/{mc}"))
              if d: upd["yarn_mappings"] = d[0].get("version") or f'{mc}+build.{d[0]["build"]}'
          except Exception as e: print("yarn: FAIL", e)
          try:
              d = json.loads(get("https://meta.fabricmc.net/v2/versions/loader"))
              s = [v for v in d if v.get("stable")]
              upd["loader_version"] = (s or d)[0]["version"]
          except Exception as e: print("loader: FAIL", e)
          try:
              q = urllib.parse.urlencode({"game_versions": json.dumps([mc]), "loaders": json.dumps(["fabric"])})
              d = json.loads(get(f"https://api.modrinth.com/v2/project/fabric-api/version?{q}"))
              d = [v for v in d if mc in v["game_versions"] and "fabric" in v["loaders"]]
              d.sort(key=lambda v: v["date_published"], reverse=True)
              if d: upd["fabric_version"] = d[0]["version_number"]
          except Exception as e: print("fabric-api: FAIL", e)
          ov = os.environ.get("LOOM_OVERRIDE", "").strip()
          if ov: upd["loom_version"] = ov
          else:
              try:
                  xml = get("https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml")
                  snaps = [v for v in re.findall(r"<version>([^<]+)</version>", xml) if re.fullmatch(r"\d+\.\d+-SNAPSHOT", v)]
                  if snaps: upd["loom_version"] = max(snaps, key=lambda v: tuple(int(x) for x in v.split("-")[0].split(".")))
              except Exception as e: print("loom: FAIL", e)
          for k, v in upd.items():
              text = re.sub(rf"^{k}\s*=.*$", f"{k}={v}", text, flags=re.M)
              print(f"{k} = {v}")
          PROPS.write_text(text, encoding="utf-8")
          if "yarn_mappings" not in upd:
              print(f"::warning::Yarn для {mc} не найден — проверь minecraft_version")
          PY

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Package full folder
        run: |
          mkdir -p dist/triggerbot
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp {} dist/triggerbot/ \;
          cp -r src dist/triggerbot/
          cp build.gradle settings.gradle gradle.properties dist/triggerbot/
          cp README.md dist/triggerbot/ || true
          ls -la dist/triggerbot

      - name: Upload jar only
        uses: actions/upload-artifact@v4
        with:
          name: triggerbot-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload full ZIP
        uses: actions/upload-artifact@v4
        with:
          name: triggerbot-full
          path: dist/triggerbot/
          if-no-files-found: error
