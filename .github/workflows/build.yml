- name: Build
        run: |
          set +e
          gradle build --no-daemon --console=plain > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "================= REAL ERROR ================="
            sed -n '/What went wrong/,/\* Try:/p' build.log | head -50
            echo "------------------ causes ------------------"
            grep -E "Caused by:|error:|Could not (find|resolve)|Unsupported class|requires Gradle|was not found|Plugin \[" build.log | head -25
            echo "=============================================="
            exit $code
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
