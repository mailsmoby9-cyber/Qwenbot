name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Locate project (unpack funtrigger.zip if it was uploaded as an archive)
        run: |
          if [ ! -f build.gradle ] && [ -f funtrigger.zip ]; then
            unzip -q -o funtrigger.zip -d _src
            echo "PROJECT_DIR=_src/funtrigger" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: funtrigger-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
