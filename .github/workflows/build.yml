name: build

on:
  push:
  workflow_dispatch:
    inputs:
      gradle_version:
        description: 'Gradle version'
        default: '8.14'
      loom_version:
        description: 'Loom (пусто = авто)'
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version || '8.14' }}

      - name: Scaffold
        run: |
          mkdir -p src/main/java/dev/tb src/main/resources
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.1
          loader_version=0.16.14
          fabric_version=0.135.0+1.21.11
          loom_version=1.11-SNAPSHOT
          mod_version=1.0.0
          maven_group=dev.tb
          archives_base_name=triggerbot
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'triggerbot'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'fabric-loom' version "${loom_version}" }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          repositories { mavenCentral() }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }
          processResources {
              inputs.property 'version', project.version
              filesMatching('fabric.mod.json') { expand 'version': project.version }
          }
          tasks.withType(JavaCompile).configureEach { options.release = 21 }
          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "triggerbot",
            "version": "${version}",
            "name": "TriggerBot",
            "license": "MIT",
            "environment": "client",
            "entrypoints": { "client": ["dev.tb.TriggerBotClient"] },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF
          cat > src/main/java/dev/tb/TriggerBotClient.java <<'EOF'
          package dev.tb;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayConnectionEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.MinecraftClient;
          public final class TriggerBotClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  Config.get();
                  Commands.register();
                  ClientTickEvents.END_CLIENT_TICK.register(TriggerEngine::tick);
                  ClientPlayConnectionEvents.DISCONNECT.register((h, c) -> TriggerEngine.onDisconnect());
                  HudRenderCallback.EVENT.register((ctx, tc) -> {
                      TriggerEngine.frame(MinecraftClient.getInstance());
                      Hud.render(ctx);
                  });
              }
          }
          EOF
          cat > src/main/java/dev/tb/Mc.java <<'EOF'
          package dev.tb;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.effect.StatusEffects;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.network.packet.c2s.play.ClientCommandC2SPacket;
          import net.minecraft.util.Hand;
          import net.minecraft.util.hit.EntityHitResult;
          import net.minecraft.world.GameMode;
          final class Mc {
              private Mc() {}
              static Entity crosshairEntity(MinecraftClient mc) {
                  return mc.crosshairTarget instanceof EntityHitResult hit ? hit.getEntity() : null;
              }
              static float charge(PlayerEntity p) { return p.getAttackCooldownProgress(0.5f); }
              static void attack(MinecraftClient mc, ClientPlayerEntity p, Entity t) {
                  mc.interactionManager.attackEntity(p, t);
                  if (!p.handSwinging) p.swingHand(Hand.MAIN_HAND);
              }
              static void sprint(MinecraftClient mc, boolean on) {
                  var nh = mc.getNetworkHandler();
                  if (nh == null || mc.player == null) return;
                  nh.sendPacket(new ClientCommandC2SPacket(mc.player,
                      on ? ClientCommandC2SPacket.Mode.START_SPRINTING
                         : ClientCommandC2SPacket.Mode.STOP_SPRINTING));
              }
              static boolean protectedMode(MinecraftClient mc, PlayerEntity p, boolean ic) {
                  var nh = mc.getNetworkHandler();
                  if (nh == null) return false;
                  var e = nh.getPlayerListEntry(p.getUuid());
                  if (e == null) return false;
                  GameMode m = e.getGameMode();
                  return m == GameMode.SPECTATOR || (ic && m == GameMode.CREATIVE);
              }
              static boolean sameTeam(Entity a, Entity b) {
                  var t = a.getScoreboardTeam();
                  return t != null && t == b.getScoreboardTeam();
              }
              static boolean falling(LivingEntity e) {
                  return !e.isOnGround() && e.getVelocity().y < 0.0 && e.fallDistance > 0.0F;
              }
              static boolean critEnvironment(LivingEntity e) {
                  return !e.isTouchingWater() && !e.isInLava() && !e.isClimbing()
                      && !e.hasVehicle() && !e.isFallFlying()
                      && !e.hasStatusEffect(StatusEffects.BLINDNESS);
              }
              static boolean critSoon(LivingEntity e) {
                  return !e.isOnGround() && !e.isTouchingWater() && !e.isInLava()
                      && !e.isClimbing() && !e.hasVehicle() && !e.isFallFlying();
              }
              static boolean spaceAbove(MinecraftClient mc, ClientPlayerEntity p) {
                  return mc.world.isSpaceEmpty(p, p.getBoundingBox().offset(0.0, 1.3, 0.0));
              }
              static void jump(ClientPlayerEntity p) {
                  var v = p.getVelocity();
                  p.setVelocity(v.x, 0.42, v.z);
              }
          }
          EOF
          cat > src/main/java/dev/tb/SprintReset.java <<'EOF'
          package dev.tb;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          final class SprintReset {
              private static final int IDLE = 0, STOP = 1, START = 2, WATCHDOG = 4;
              private static int state = IDLE, at;
              private static boolean stopSent, forCrit;
              private SprintReset() {}
              static void dropForCrit(MinecraftClient mc, ClientPlayerEntity p, int tick) {
                  if (mc.getNetworkHandler() == null || !p.isSprinting()) return;
                  Mc.sprint(mc, false);
                  stopSent = true; state = START; at = tick; forCrit = true;
              }
              static void afterAttack(MinecraftClient mc, ClientPlayerEntity p, int tick) {
                  if (state != IDLE || !Config.get().sprintReset) return;
                  if (!p.isSprinting() || mc.getNetworkHandler() == null) return;
                  state = STOP; at = tick; forCrit = false;
              }
              static void tick(MinecraftClient mc, boolean enabled, int tick) {
                  if (state == IDLE) return;
                  ClientPlayerEntity p = mc.player;
                  if (p == null || mc.world == null || mc.getNetworkHandler() == null) { reset(); return; }
                  if (!enabled || (!forCrit && !Config.get().sprintReset) || tick - at > WATCHDOG) { finish(mc); return; }
                  if (state == STOP) {
                      if (p.isSprinting()) { Mc.sprint(mc, false); stopSent = true; }
                      state = START; at = tick;
                  } else {
                      if (p.isSprinting()) Mc.sprint(mc, true);
                      reset();
                  }
              }
              static void finish(MinecraftClient mc) {
                  ClientPlayerEntity p = mc.player;
                  if (stopSent && p != null && p.isSprinting() && mc.getNetworkHandler() != null) Mc.sprint(mc, true);
                  reset();
              }
              static void reset() { state = IDLE; stopSent = false; forCrit = false; }
          }
          EOF
          cat > src/main/java/dev/tb/Hud.java <<'EOF'
          package dev.tb;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          final class Hud {
              private static final int ON = 0xFF55FF55, OFF = 0xFF9E9E9E;
              private static String label = "TriggerBot: OFF";
              private static int color = OFF;
              private Hud() {}
              static void state(boolean on) {
                  label = on ? "TriggerBot: ON" : "TriggerBot: OFF";
                  color = on ? ON : OFF;
              }
              static void render(DrawContext ctx) {
                  if (!Config.get().hud) return;
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (mc.options.hudHidden) return;
                  ctx.drawTextWithShadow(mc.textRenderer, label, 4, 4, color);
              }
          }
          EOF
          cat > src/main/java/dev/tb/Config.java <<'EOF'
          package dev.tb;
          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;
          import org.lwjgl.glfw.GLFW;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;
          import java.io.BufferedReader;
          import java.io.BufferedWriter;
          import java.nio.file.Files;
          import java.nio.file.Path;
          public final class Config {
              private static final Logger LOG = LoggerFactory.getLogger("triggerbot");
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static final Path FILE = FabricLoader.getInstance().getConfigDir().resolve("triggerbot.json");
              private static final Config INSTANCE = load();
              public boolean hud = true, fast = true, sprintReset = true, strictAim = true;
              public boolean ignoreCreative = true, ignoreTeammates = true, ignoreInvisible = false;
              public String crit = "auto";
              public int critLead = 7, critWait = 8, chargePercent = 100, lockTicks = 0;
              public double range = 0.0;
              public int toggleKey = GLFW.GLFW_KEY_R;
              public String targets = "players";
              public transient float charge = 1.0f;
              public transient double rangeSq = 0.0;
              public transient int targetMode = 0, critMode = 2;
              private Config() {}
              public static Config get() { return INSTANCE; }
              private static Config load() {
                  Config c = null;
                  if (Files.isRegularFile(FILE)) {
                      try (BufferedReader r = Files.newBufferedReader(FILE)) { c = GSON.fromJson(r, Config.class); }
                      catch (Exception e) { LOG.warn("config broken", e); }
                  }
                  if (c == null) c = new Config();
                  c.sanitize(); c.save();
                  return c;
              }
              public void sanitize() {
                  chargePercent = clamp(chargePercent, 50, 100);
                  critLead = clamp(critLead, 3, 10);
                  critWait = clamp(critWait, 0, 12);
                  lockTicks = clamp(lockTicks, 0, 5);
                  toggleKey = clamp(toggleKey, 32, 348);
                  range = Math.max(0.0, Math.min(6.0, range));
                  if (targets == null) targets = "players";
                  switch (targets) {
                      case "hostile" -> targetMode = 1;
                      case "all" -> targetMode = 2;
                      default -> { targets = "players"; targetMode = 0; }
                  }
                  if (crit == null) crit = "auto";
                  switch (crit) {
                      case "off" -> critMode = 0;
                      case "wait" -> critMode = 1;
                      default -> { crit = "auto"; critMode = 2; }
                  }
                  charge = chargePercent / 100.0f;
                  rangeSq = range * range;
              }
              public void save() {
                  try {
                      Files.createDirectories(FILE.getParent());
                      try (BufferedWriter w = Files.newBufferedWriter(FILE)) { GSON.toJson(this, w); }
                  } catch (Exception e) { LOG.warn("save failed", e); }
              }
              private static int clamp(int v, int lo, int hi) { return v < lo ? lo : (v > hi ? hi : v); }
          }
          EOF
          cat > src/main/java/dev/tb/Commands.java <<'EOF'
          package dev.tb;
          import com.mojang.brigadier.arguments.StringArgumentType;
          import com.mojang.brigadier.builder.LiteralArgumentBuilder;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.command.v2.FabricClientCommandSource;
          import net.minecraft.text.Text;
          final class Commands {
              private Commands() {}
              static void register() {
                  ClientCommandRegistrationCallback.EVENT.register((d, a) -> {
                      d.register(build("triggerbot"));
                      d.register(build("tb"));
                  });
              }
              private static LiteralArgumentBuilder<FabricClientCommandSource> build(String name) {
                  return ClientCommandManager.literal(name)
                      .executes(c -> { TriggerEngine.toggle(); return 1; })
                      .then(ClientCommandManager.literal("on").executes(c -> { TriggerEngine.setEnabled(true); return 1; }))
                      .then(ClientCommandManager.literal("off").executes(c -> { TriggerEngine.setEnabled(false); return 1; }))
                      .then(ClientCommandManager.literal("status").executes(c -> status(c.getSource())))
                      .then(ClientCommandManager.literal("set")
                          .then(ClientCommandManager.argument("option", StringArgumentType.word())
                              .then(ClientCommandManager.argument("value", StringArgumentType.word())
                                  .executes(c -> set(c.getSource(),
                                      StringArgumentType.getString(c, "option"),
                                      StringArgumentType.getString(c, "value"))))));
              }
              private static int status(FabricClientCommandSource s) {
                  Config c = Config.get();
                  msg(s, "TriggerBot: " + (TriggerEngine.isEnabled() ? "ON" : "OFF"));
                  msg(s, "crit=" + c.crit + " lead=" + c.critLead + " wait=" + c.critWait + " charge=" + c.chargePercent);
                  msg(s, "sprint=" + c.sprintReset + " fast=" + c.fast + " aim=" + c.strictAim);
                  msg(s, "targets=" + c.targets + " hud=" + c.hud + " key=" + c.toggleKey);
                  return 1;
              }
              private static int set(FabricClientCommandSource s, String o, String v) {
                  Config c = Config.get();
                  try {
                      switch (o.toLowerCase()) {
                          case "crit" -> c.crit = v.toLowerCase();
                          case "lead" -> c.critLead = Integer.parseInt(v);
                          case "wait" -> c.critWait = Integer.parseInt(v);
                          case "charge" -> c.chargePercent = Integer.parseInt(v);
                          case "lock" -> c.lockTicks = Integer.parseInt(v);
                          case "range" -> c.range = Double.parseDouble(v);
                          case "targets" -> c.targets = v.toLowerCase();
                          case "sprint" -> c.sprintReset = bool(v);
                          case "fast" -> c.fast = bool(v);
                          case "hud" -> c.hud = bool(v);
                          case "aim" -> c.strictAim = bool(v);
                          case "creative" -> c.ignoreCreative = bool(v);
                          case "team" -> c.ignoreTeammates = bool(v);
                          case "invisible" -> c.ignoreInvisible = bool(v);
                          case "key" -> c.toggleKey = key(v);
                          default -> { msg(s, "no option " + o); return 0; }
                      }
                  } catch (Exception ex) { msg(s, "bad value " + v); return 0; }
                  c.sanitize(); c.save();
                  msg(s, o + " = " + v);
                  return 1;
              }
              private static boolean bool(String v) {
                  if (v.equalsIgnoreCase("on") || v.equalsIgnoreCase("true") || v.equals("1")) return true;
                  if (v.equalsIgnoreCase("off") || v.equalsIgnoreCase("false") || v.equals("0")) return false;
                  throw new IllegalArgumentException(v);
              }
              private static int key(String v) {
                  if (v.length() == 1) {
                      char ch = Character.toUpperCase(v.charAt(0));
                      if (ch >= 'A' && ch <= 'Z') return ch;
                      if (ch >= '0' && ch <= '9') return ch;
                  }
                  return Integer.parseInt(v);
              }
              private static void msg(FabricClientCommandSource s, String t) { s.sendFeedback(Text.literal("[TB] " + t)); }
          }
          EOF
          cat > src/main/java/dev/tb/TriggerEngine.java <<'EOF'
          package dev.tb;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.world.ClientWorld;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.decoration.ArmorStandEntity;
          import net.minecraft.entity.mob.HostileEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;
          import net.minecraft.util.math.Box;
          import org.lwjgl.glfw.GLFW;
          public final class TriggerEngine {
              private static final double RAD = Math.PI / 180.0, SLACK = 0.12, MAX_RAY = 6.0;
              private static final int MIN_GAP = 2;
              private static final float MARK = 0.9f;
              private static boolean enabled, keyWasDown;
              private static int tick;
              private static ClientWorld world;
              private static int lockedId = -1, lockedAt, attackTick = -1000, period = 12;
              private static boolean periodMeasured = true, recharged = true, serverFalling;
              private static int critWaitFrom = -1;
              private TriggerEngine() {}
              static boolean isEnabled() { return enabled; }
              static void toggle() { setEnabled(!enabled); }
              static void setEnabled(boolean on) {
                  if (enabled == on) return;
                  enabled = on;
                  clearTarget();
                  MinecraftClient mc = MinecraftClient.getInstance();
                  SprintReset.finish(mc);
                  Hud.state(on);
                  if (mc.player != null) {
                      mc.player.sendMessage(Text.literal(on ? "TriggerBot: ON" : "TriggerBot: OFF")
                          .formatted(on ? Formatting.GREEN : Formatting.RED), true);
                  }
              }
              static void onDisconnect() { setEnabled(false); hardReset(); }
              private static void hardReset() {
                  clearTarget(); SprintReset.reset();
                  recharged = true; periodMeasured = true; period = 12;
                  serverFalling = false; attackTick = tick - 1000;
              }
              private static void clearTarget() { lockedId = -1; critWaitFrom = -1; }
              static void frame(MinecraftClient mc) {
                  pollKey(mc);
                  if (!enabled || !Config.get().fast) return;
                  evaluate(mc, false);
              }
              static void tick(MinecraftClient mc) {
                  tick++;
                  pollKey(mc);
                  ClientWorld w = mc.world;
                  if (w != world) { world = w; hardReset(); }
                  SprintReset.tick(mc, enabled, tick);
                  if (!enabled) return;
                  evaluate(mc, true);
              }
              private static void evaluate(MinecraftClient mc, boolean tickMode) {
                  if (mc.world == null || mc.player == null || mc.interactionManager == null
                          || mc.getNetworkHandler() == null) { clearTarget(); return; }
                  if (mc.currentScreen != null || mc.isPaused()) { clearTarget(); return; }
                  ClientPlayerEntity p = mc.player;
                  if (mc.getCameraEntity() != p || !p.isAlive() || p.isSpectator()) { clearTarget(); return; }
                  Entity e = Mc.crosshairEntity(mc);
                  if (e == null || !valid(mc, p, e)) { clearTarget(); return; }
                  Config c = Config.get();
                  int id = e.getId();
                  if (id != lockedId) { lockedId = id; lockedAt = tick; critWaitFrom = -1; }
                  if (tick - lockedAt < c.lockTicks) return;
                  float charge = Mc.charge(p);
                  if (charge < MARK) recharged = true;
                  if (tickMode) {
                      serverFalling = Mc.falling(p);
                      if (!periodMeasured && charge >= 1.0f) {
                          int m = tick - attackTick;
                          if (m >= 4 && m <= 40) period = m;
                          periodMeasured = true;
                      }
                      if (c.critMode == 2 && charge < c.charge) {
                          int rem = (int) Math.ceil((1.0f - charge) * period);
                          if (rem >= 1 && rem <= c.critLead && canJump(mc, p)) { Mc.jump(p); critWaitFrom = tick; }
                      }
                  }
                  if (charge < c.charge) return;
                  int gap = tick - attackTick;
                  if (gap < MIN_GAP) return;
                  if (!recharged && gap < period) return;
                  if (p.isUsingItem()) return;
                  if (tickMode && c.strictAim && !aimOnTarget(p, e.getBoundingBox())) return;
                  boolean critReady = c.critMode > 0 && serverFalling && Mc.falling(p) && Mc.critEnvironment(p);
                  if (c.critMode > 0 && !critReady) {
                      boolean possible = Mc.critSoon(p);
                      if (!possible && c.critMode == 2 && tickMode && canJump(mc, p)) { Mc.jump(p); possible = true; }
                      if (possible) {
                          if (critWaitFrom < 0) critWaitFrom = tick;
                          if (tick - critWaitFrom < c.critWait) return;
                      }
                  }
                  if (critReady) SprintReset.dropForCrit(mc, p, tick);
                  Mc.attack(mc, p, e);
                  if (!critReady) SprintReset.afterAttack(mc, p, tick);
                  attackTick = tick; periodMeasured = false; recharged = false; critWaitFrom = -1;
              }
              private static boolean canJump(MinecraftClient mc, ClientPlayerEntity p) {
                  return p.isOnGround() && !p.isTouchingWater() && !p.isInLava()
                      && !p.hasVehicle() && !p.isClimbing() && !p.isFallFlying()
                      && !p.isSneaking() && !p.isUsingItem()
                      && !mc.options.jumpKey.isPressed() && Mc.spaceAbove(mc, p);
              }
              private static void pollKey(MinecraftClient mc) {
                  if (mc.currentScreen != null) { keyWasDown = true; return; }
                  boolean down = GLFW.glfwGetKey(mc.getWindow().getHandle(), Config.get().toggleKey) == GLFW.GLFW_PRESS;
                  if (down && !keyWasDown) toggle();
                  keyWasDown = down;
              }
              private static boolean valid(MinecraftClient mc, ClientPlayerEntity p, Entity e) {
                  if (e == p || !(e instanceof LivingEntity le)) return false;
                  if (e.isRemoved() || !e.isAlive() || le.getHealth() <= 0.0f) return false;
                  if (e instanceof ArmorStandEntity) return false;
                  Config c = Config.get();
                  if (e instanceof PlayerEntity pe) {
                      if (Mc.protectedMode(mc, pe, c.ignoreCreative)) return false;
                      if (c.ignoreTeammates && Mc.sameTeam(p, pe)) return false;
                  } else if (c.targetMode == 0 || (c.targetMode == 1 && !(e instanceof HostileEntity))) {
                      return false;
                  }
                  if (c.ignoreInvisible && e.isInvisible()) return false;
                  if (c.rangeSq > 0.0 && boxDistSq(p, e) > c.rangeSq) return false;
                  return true;
              }
              private static double boxDistSq(Entity f, Entity t) {
                  double x = f.getX(), y = f.getEyeY(), z = f.getZ();
                  Box b = t.getBoundingBox();
                  double dx = Math.max(0.0, Math.max(b.minX - x, x - b.maxX));
                  double dy = Math.max(0.0, Math.max(b.minY - y, y - b.maxY));
                  double dz = Math.max(0.0, Math.max(b.minZ - z, z - b.maxZ));
                  return dx * dx + dy * dy + dz * dz;
              }
              private static boolean aimOnTarget(ClientPlayerEntity p, Box b) {
                  double yaw = p.getYaw() * RAD, pitch = p.getPitch() * RAD;
                  double cp = Math.cos(pitch);
                  double dx = -Math.sin(yaw) * cp, dy = -Math.sin(pitch), dz = Math.cos(yaw) * cp;
                  double ox = p.getX(), oy = p.getEyeY(), oz = p.getZ();
                  double tMin = 0.0, tMax = MAX_RAY;
                  double min = b.minX - SLACK, max = b.maxX + SLACK;
                  if (Math.abs(dx) < 1.0E-7) { if (ox < min || ox > max) return false; }
                  else {
                      double t1 = (min - ox) / dx, t2 = (max - ox) / dx;
                      if (t1 > t2) { double t = t1; t1 = t2; t2 = t; }
                      if (t1 > tMin) tMin = t1;
                      if (t2 < tMax) tMax = t2;
                      if (tMin > tMax) return false;
                  }
                  min = b.minY - SLACK; max = b.maxY + SLACK;
                  if (Math.abs(dy) < 1.0E-7) { if (oy < min || oy > max) return false; }
                  else {
                      double t1 = (min - oy) / dy, t2 = (max - oy) / dy;
                      if (t1 > t2) { double t = t1; t1 = t2; t2 = t; }
                      if (t1 > tMin) tMin = t1;
                      if (t2 < tMax) tMax = t2;
                      if (tMin > tMax) return false;
                  }
                  min = b.minZ - SLACK; max = b.maxZ + SLACK;
                  if (Math.abs(dz) < 1.0E-7) { if (oz < min || oz > max) return false; }
                  else {
                      double t1 = (min - oz) / dz, t2 = (max - oz) / dz;
                      if (t1 > t2) { double t = t1; t1 = t2; t2 = t; }
                      if (t1 > tMin) tMin = t1;
                      if (t2 < tMax) tMax = t2;
                      if (tMin > tMax) return false;
                  }
                  return true;
              }
          }
          EOF
          find . -name '*.java' | sort

      - name: Resolve versions
        env:
          LOOM_OVERRIDE: ${{ inputs.loom_version }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from pathlib import Path
          P = Path("gradle.properties")
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "tb-ci"})
              return urllib.request.urlopen(r, timeout=40).read().decode()
          t = P.read_text()
          mc = re.search(r"^minecraft_version\s*=\s*(.+)$", t, re.M).group(1).strip()
          upd = {}
          try:
              d = json.loads(get("https://meta.fabricmc.net/v2/versions/yarn/" + mc))
              if d: upd["yarn_mappings"] = d[0]["version"]
          except Exception as e: print("yarn", e)
          try:
              d = json.loads(get("https://meta.fabricmc.net/v2/versions/loader"))
              s = [v for v in d if v.get("stable")]
              upd["loader_version"] = (s or d)[0]["version"]
          except Exception as e: print("loader", e)
          try:
              q = urllib.parse.urlencode({"game_versions": json.dumps([mc]), "loaders": json.dumps(["fabric"])})
              d = json.loads(get("https://api.modrinth.com/v2/project/fabric-api/version?" + q))
              d = [v for v in d if mc in v["game_versions"]]
              d.sort(key=lambda v: v["date_published"], reverse=True)
              if d: upd["fabric_version"] = d[0]["version_number"]
          except Exception as e: print("api", e)
          ov = os.environ.get("LOOM_OVERRIDE", "").strip()
          if ov: upd["loom_version"] = ov
          for k, v in upd.items():
              t = re.sub(r"^" + k + r"\s*=.*$", k + "=" + v, t, flags=re.M)
              print(k, "=", v)
          P.write_text(t)
          PY

      - name: Build
        run: |
          set +e
          gradle build --no-daemon --console=plain > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            {
              echo '## REAL ERROR'
              echo '```'
              sed -n '/What went wrong/,/\* Try:/p' build.log | head -40
              grep -E "Caused by:|error:|Could not (find|resolve)|requires Gradle|was not found" build.log | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -60 build.log
            exit $code
          fi

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: triggerbot-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
