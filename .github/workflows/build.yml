name: build

on:
  push:
  workflow_dispatch:
    inputs:
      loom_version:
        description: 'Fabric Loom'
        default: '1.14-SNAPSHOT'
      gradle_version:
        description: 'Gradle'
        default: '9.2.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Ищем проект: в корне, в подпапке или внутри .zip (распаковка только на раннере)
      - name: Find project
        run: |
          find_proj() {
            find . -maxdepth 4 -name settings.gradle -not -path './.git/*' \
              | awk -F/ '{print NF" "$0}' | sort -n | sed -n '1p' | cut -d' ' -f2-
          }
          S=$(find_proj)
          if [ -z "$S" ]; then
            Z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | sed -n '1p')
            if [ -z "$Z" ]; then
              echo "::error::Не нашёл ни settings.gradle, ни .zip с проектом"
              exit 1
            fi
            echo "Распаковываю $Z"
            unzip -oq "$Z" -d _src
            S=$(find_proj)
          fi
          if [ -z "$S" ]; then
            echo "::error::settings.gradle не найден"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
          echo "Проект: $(dirname "$S")"

      - name: Install Gradle
        run: |
          V="${{ inputs.gradle_version || '9.2.1' }}"
          curl -fsSL --retry 3 "https://services.gradle.org/distributions/gradle-${V}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${V}/bin" >> "$GITHUB_PATH"

      # Версии подставляются только в копии на раннере, репозиторий не меняется
      - name: Resolve Fabric versions
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          LOOM: ${{ inputs.loom_version || '1.14-SNAPSHOT' }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          from pathlib import Path

          P = Path("gradle.properties")
          text = P.read_text(encoding="utf-8")

          def prop(k):
              m = re.search(rf"^{k}\s*=\s*(.+)$", text, re.M)
              return m.group(1).strip() if m else ""

          def get(url):
              r = urllib.request.Request(url, headers={"User-Agent": "triggerbot-ci/1.0"})
              with urllib.request.urlopen(r, timeout=40) as f:
                  return f.read().decode("utf-8")

          def key(v):
              return tuple(int(x) for x in re.findall(r"\d+", v.split("+")[0]))

          mc = prop("minecraft_version")
          if not mc:
              sys.exit("minecraft_version не задан в gradle.properties")
          print("Minecraft:", mc)
          upd = {"loom_version": os.environ["LOOM"]}

          try:
              d = json.loads(get(f"https://meta.fabricmc.net/v2/versions/yarn/{mc}"))
              if d:
                  upd["yarn_mappings"] = d[0]["version"]
          except Exception as e:
              print("yarn: FAIL", e)

          try:
              d = json.loads(get("https://meta.fabricmc.net/v2/versions/loader"))
              st = [v for v in d if v.get("stable")]
              upd["loader_version"] = (st or d)[0]["version"]
          except Exception as e:
              print("loader: FAIL", e)

          try:
              xml = get("https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml")
              vs = [v for v in re.findall(r"<version>([^<]+)</version>", xml) if v.endswith("+" + mc)]
              if vs:
                  upd["fabric_version"] = max(vs, key=key)
          except Exception as e:
              print("fabric-api: FAIL", e)

          for k, v in upd.items():
              if re.search(rf"^{k}\s*=", text, re.M):
                  text = re.sub(rf"^{k}\s*=.*$", lambda m: f"{k}={v}", text, flags=re.M)
              else:
                  text += f"\n{k}={v}\n"
              print(f"{k} = {v}")
          P.write_text(text, encoding="utf-8")
          PY

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace --console=plain

      - name: Package
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p dist/triggerbot
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' \
            -exec cp {} dist/triggerbot/ \;
          cp -r src dist/triggerbot/
          cp build.gradle settings.gradle gradle.properties dist/triggerbot/
          cp README.md dist/triggerbot/ || true
          ls -la dist/triggerbot

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: triggerbot-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-dev.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload full ZIP
        uses: actions/upload-artifact@v7
        with:
          name: triggerbot-full
          path: ${{ env.PROJECT_DIR }}/dist/triggerbot/
          if-no-files-found: error
